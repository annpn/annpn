<script>
  // Tema antes da primeira pintura: no fim do body, quem escolheu o escuro
  // veria um lampejo claro a cada abertura.

    document.documentElement.dataset.tema =
      localStorage.getItem("rh-tema") === "escuro" ? "escuro" : "claro";
  } catch (erro) {
    document.documentElement.dataset.tema = "claro";
  }
</script>
